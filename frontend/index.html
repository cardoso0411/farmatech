<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Farmatech</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../public/styles.css">
</head>
<body>
  <div class="container py-4">
    <header class="text-center mb-4">
      <h1 class="display-6">Sistema de Gerenciamento da Farmácia Brasil</h1>
      <p class="text-muted">Cadastro de clientes e remédios</p>
    </header>

    <nav class="nav nav-pills justify-content-center mb-4" id="menuTabs">
      <button id="btnClientes" class="nav-link active" type="button">Clientes</button>
      <button id="btnRemedios" class="nav-link" type="button">Remédios</button>
    </nav>

    <div id="feedbackMessage"></div>

    <main>
      <section id="clientes" class="section">
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <h2 class="card-title h5">Cadastro de Clientes</h2>
            <form id="clienteForm" class="row g-3">
              <div class="col-md-4">
                <label for="clienteNome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="clienteNome" required>
              </div>
              <div class="col-md-4">
                <label for="clienteEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="clienteEmail" required>
              </div>
              <div class="col-md-4">
                <label for="clienteTelefone" class="form-label">Telefone</label>
                <input type="tel" class="form-control" id="clienteTelefone" required>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary">Cadastrar Cliente</button>
              </div>
            </form>
          </div>
        </div>

        <div id="clientesList" class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title h6">Status Clientes</h3>
            <div id="clientesContent"></div>
          </div>
        </div>
      </section>

      <section id="remedios" class="section d-none">
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <h2 class="card-title h5">Cadastro de Remédios</h2>
            <form id="remedioForm" class="row g-3">
              <div class="col-md-4">
                <label for="remedioNome" class="form-label">Nome do Remédio</label>
                <input type="text" class="form-control" id="remedioNome" required>
              </div>
              <div class="col-md-4">
                <label for="remedioFabricante" class="form-label">Fabricante</label>
                <input type="text" class="form-control" id="remedioFabricante" required>
              </div>
              <div class="col-md-4">
                <label for="remedioPreco" class="form-label">Preço</label>
                <input type="number" class="form-control" id="remedioPreco" step="0.01" required>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-success">Cadastrar Remédio</button>
              </div>
            </form>
          </div>
        </div>

        <div id="remediosList" class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title h6">Status Remédios</h3>
            <div id="remediosContent"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../public/app.js"></script>
</body>
</html>
